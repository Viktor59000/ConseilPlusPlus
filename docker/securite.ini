; Réglages PHP de sécurité (en ligne). Le code d'authentification du cours n'est pas modifié :
; ces options s'appliquent à toutes les sessions, celles du site comme celles du Bureau.
session.cookie_httponly = 1      ; le cookie de session n'est pas lisible par JavaScript
session.cookie_secure = 1        ; envoyé uniquement en HTTPS
session.cookie_samesite = "Lax"  ; pas envoyé par les requêtes venant d'autres sites (CSRF)
session.use_strict_mode = 1      ; refuse un identifiant de session inventé par le visiteur
expose_php = Off                 ; ne pas annoncer la version de PHP
