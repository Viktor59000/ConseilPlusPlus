<!DOCTYPE html>
<!-- Modèle de l'image d'aperçu des liens (assets/og-image.png, 1200 × 630). À rouvrir et capturer après une retouche. -->
<html lang="fr"><head><meta charset="UTF-8"><title>Image d'aperçu</title>
<style>
@font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; src: url("../assets/fonts/schibsted-grotesk.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("../assets/fonts/jetbrains-mono-500.woff2") format("woff2"); }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F5F6FA; color: #1B2440; font-family: "Schibsted Grotesk", Arial, sans-serif; position: relative; }
.logo { position: absolute; left: 80px; top: 64px; height: 64px; }
h1 { position: absolute; left: 80px; top: 200px; margin: 0; font-size: 104px; line-height: 1; font-weight: 800; letter-spacing: -.04em; }
mark { background: linear-gradient(#FFE14D, #FFE14D) no-repeat 0 62% / 100% 80%; color: inherit; padding: 0 .1em; }
.rubrique { position: absolute; left: 80px; bottom: 72px; font: 500 24px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #525A73; display: flex; align-items: center; gap: 18px; }
.rubrique::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: #C8102E; }
.tampon { position: absolute; right: 100px; top: 120px; padding: 10px 24px; border: 6px double #C8102E; border-radius: 12px; color: #C8102E; font: 700 34px "JetBrains Mono", monospace; letter-spacing: .2em; transform: rotate(-9deg); }
</style></head><body>
<img class="logo" src="../assets/logo.svg" alt="">
<h1>Des conseils.<br><mark>C'est déjà ça.</mark></h1>
<p class="rubrique">Le conseiller moyen · conseilplus.onrender.com</p>
<span class="tampon">VALIDÉ</span>
</body></html>
