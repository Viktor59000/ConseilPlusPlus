# Visite du site en ligne toutes les 6 h (offre gratuite Render, base TiDB Cloud) :
# - vérifie que le site et la base répondent (le workflow échoue sinon : GitHub prévient par courriel) ;
# - fait préparer par l'IA le mot (presque) du jour du lendemain ;
# - envoie la notification du mot du jour aux abonnés.
name: Réveil quotidien

on:
  schedule:
    - cron: '17 5 * * *'          # 5 h 17 UTC : passe du matin (avec la notification du mot du jour)
    - cron: '17 11,17,23 * * *'   # passes de contrôle toutes les 6 h
  workflow_dispatch:        # lancement à la main depuis l'onglet Actions

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le site (jusqu'à 2 minutes)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 -o /dev/null https://conseilplus.onrender.com/
      - name: Mot du jour (lit la base)
        run: curl --fail --silent --show-error --max-time 60 https://conseilplus.onrender.com/api/mot-du-jour.php
      - name: Préparer le mot de demain
        run: curl --silent --show-error --max-time 90 -X POST https://conseilplus.onrender.com/api/mot-du-jour.php
      - name: Envoyer la notification du mot du jour (une fois par jour au plus)
        # seulement à la passe du matin (ou au lancement manuel) : jamais de notification la nuit
        if: github.event.schedule == '17 5 * * *' || github.event_name == 'workflow_dispatch'
        # (commande en bloc « | » : un « : » suivi d'une espace casserait le YAML et tout le workflow)
        run: |
          curl --silent --show-error --max-time 120 -X POST -H "Content-Type: application/json" -d '{"action":"envoyer"}' https://conseilplus.onrender.com/api/notifications.php
