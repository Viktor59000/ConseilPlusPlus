# Construit l'application Android (dossier android/) et publie l'APK dans la release « android » du dépôt.
# Adresse fixe de téléchargement (utilisée par application.php) :
#   https://github.com/Viktor59000/ConseilPlusPlus/releases/download/android/conseilplus.apk
name: Application Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Clé de signature tirée des secrets du dépôt (jamais dans Git). Sans eux, on s'arrête : pas d'APK non signé.
      - name: Clé de signature
        env:
          ANDROID_CLE_P12: ${{ secrets.ANDROID_CLE_P12 }}
        run: |
          if [ -z "$ANDROID_CLE_P12" ]; then echo "Secrets ANDROID_CLE_P12 et ANDROID_CLE_MDP absents (voir docs/DEPLOIEMENT.md)."; exit 1; fi
          echo "$ANDROID_CLE_P12" | base64 --decode > "$RUNNER_TEMP/conseilplus.p12"

      - name: Construire l'APK
        working-directory: android
        env:
          ANDROID_CLE_FICHIER: ${{ runner.temp }}/conseilplus.p12
          ANDROID_CLE_MDP: ${{ secrets.ANDROID_CLE_MDP }}
        run: gradle assembleRelease --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk conseilplus.apk

      - name: Publier dans la release « android »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android \
            --title "Application Android" \
            --notes "ConseilPlus+ pour Android : l'appli et le widget « Le Petit Moyen ». Mise à jour automatique à chaque modification du dossier android/." \
            --latest=false
          gh release upload android conseilplus.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: conseilplus-apk
          path: conseilplus.apk
